# main 브랜치에 올리면 서버 없는 웹 버전(dist/preview/index.html)을 빌드·검사해 GitHub Pages로 배포한다.
# API 키를 쓰지 않는다(정적 페이지라 키를 넣으면 누구나 볼 수 있음). 저장은 사용자 브라우저에만 된다.
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      # 단위·통합 시험(브라우저 시험은 Chromium 설치가 필요해 여기서는 생략)
      - run: npm test
      - name: Prepare Pages folder
        run: |
          mkdir -p _site
          cp dist/preview/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
